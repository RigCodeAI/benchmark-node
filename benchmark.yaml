schema_version: security-benchmark-metadata/v1
name: BenchmarkNode
suite_id: sivere-benchmark-node-v1
maintainer: ZeroSurface
license: MIT
default_application: koa
applications:
  - { id: koa, command: "./runBenchmark.sh koa", url: "http://127.0.0.1:3000" }
  - { id: koa-sources, command: "./runBenchmark.sh koa-sources", url: "http://127.0.0.1:3000" }
  - { id: koa2, command: "./runBenchmark.sh koa2", url: "http://127.0.0.1:3000" }
  - { id: koa-esm, command: "./runBenchmark.sh koa-esm", url: "http://127.0.0.1:3000" }
  - { id: nest10-express, command: "./runBenchmark.sh nest10-express", url: "http://127.0.0.1:3000" }
  - { id: nest10-fastify, command: "./runBenchmark.sh nest10-fastify", url: "http://127.0.0.1:3000" }
  - { id: nest-express, command: "./runBenchmark.sh nest-express", url: "http://127.0.0.1:3000" }
  - { id: nest-fastify, command: "./runBenchmark.sh nest-fastify", url: "http://127.0.0.1:3000" }
  - { id: aurelia1, command: "./runBenchmark.sh aurelia1", url: "http://127.0.0.1:3000" }
  - { id: aurelia2, command: "./runBenchmark.sh aurelia2", url: "http://127.0.0.1:3000" }
public_scoring:
  controls: [vulnerable, safe]
  formats: [json, sarif-2.1.0, csv]
qualification:
  controls: [vulnerable, safe, unknown, unsupported]
  evidence_schema: schemas/qualification-evidence-v1.schema.json
