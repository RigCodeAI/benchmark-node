name: benchmark

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: ./scripts/check-architecture.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --quiet --locked -- verify
      - run: ./scoreBenchmark.sh --results results/examples/example-sast.sarif --output-dir /tmp/example-scorecard
      - run: bash -n runBenchmark.sh scoreBenchmark.sh verifyBenchmark.sh
      - run: jq empty schemas/*.json cases/catalog.json truth-v1.json

  node-matrix:
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.2, 24.19.0, 26.7.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix corpus/language
      - run: npm test --prefix corpus/language
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix apps/koa-product
      - run: npm test --prefix apps/koa-product
      - run: node scripts/smoke-applications.mjs

  framework-applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.19.0, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: ./verifyBenchmark.sh

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NODE_VERSION=24.19.0 --build-arg BENCHMARK_APP=koa .
      - run: docker build --build-arg NODE_VERSION=24.19.0 --build-arg BENCHMARK_APP=nest-express .
      - run: docker build --build-arg NODE_VERSION=24.19.0 --build-arg BENCHMARK_APP=aurelia2 .
